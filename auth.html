<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FitForge — Вхід</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='4' fill='%230f172a'/%3E%3Cpath fill='%23B8F55A' d='M20.57 14.86L22 13.43 20.57 12 17 15.57 8.43 7 12 3.43 10.57 2 9.14 3.43 7.71 2 5.57 4.14 4.14 2.71 2.71 4.14l1.43 1.43L2 7.71l1.43 1.43L2 10.57 3.43 12 7 8.43 15.57 17 12 20.57 13.43 22l1.43-1.43L16.29 22l2.14-2.14 1.43 1.43 1.43-1.43-1.43-1.43L22 16.29z'/%3E%3C/svg%3E"/>
  <link href="global.css" rel="stylesheet"/>
  <link href="styles/auth.css" rel="stylesheet"/>
</head>
<body>
  <div class="site-wrapper">

    <picture>
      <source srcset="images/backDecstop.png" media="(min-width: 768px)"/>
      <img alt="Фон" class="hero-bg" src="images/backMobile.png"/>
    </picture>
    <div class="hero-overlay"></div>

    <nav class="navbar scrolled">
      <div class="navbar-inner">
        <a href="index.html" class="nav-logo">FIT<span>FORGE</span></a>
        <div class="nav-links">
          <a href="index.html" class="nav-link">Головна</a>
        </div>
      </div>
    </nav>

    <main class="auth-main">
      <div class="auth-card">

        <!-- Лого -->
        <div class="auth-logo">
          <span class="auth-logo-text">FIT<span>FORGE</span></span>
        </div>

        <h1 class="auth-title" id="auth-title">Вхід</h1>
        <p class="auth-subtitle" id="auth-subtitle">Увійдіть до свого кабінету</p>

        <!-- Google -->
        <button class="btn-google" id="btn-google">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"/>
            <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/>
            <path d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
            <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
          </svg>
          Увійти через Google
        </button>

        <div class="auth-divider"><span>або</span></div>

        <!-- Форма -->
        <div id="auth-mode" data-mode="login" style="display:contents">

          <!-- Ім'я (тільки при реєстрації) -->
          <div class="auth-field" id="auth-name-wrap" style="display:none">
            <label class="auth-label">Ім'я</label>
            <input class="auth-input" id="auth-name" type="text" placeholder="Як вас звати?" autocomplete="name"/>
          </div>

          <div class="auth-field">
            <label class="auth-label">Email</label>
            <input class="auth-input" id="auth-email" type="email" placeholder="your@email.com" autocomplete="email"/>
          </div>

          <div class="auth-field">
            <label class="auth-label">Пароль</label>
            <div class="auth-password-wrap">
              <input class="auth-input" id="auth-password" type="password" placeholder="••••••••" autocomplete="current-password"/>
              <button class="btn-toggle-pw" id="btn-toggle-pw" type="button" tabindex="-1">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" id="eye-icon">
                  <ellipse cx="8" cy="8" rx="3" ry="3" stroke="currentColor" stroke-width="1.4"/>
                  <path d="M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                </svg>
              </button>
            </div>
          </div>

        </div>

        <p class="auth-error" id="auth-error"></p>

        <button class="btn-primary auth-submit" id="btn-submit">Увійти</button>

        <button class="auth-toggle" id="auth-toggle">Немає акаунту? Зареєструватись</button>

      </div>
    </main>

  </div>

  <script type="module" src="js/auth.js"></script>
  <script>
    // Показати/приховати пароль
    document.getElementById("btn-toggle-pw").addEventListener("click", () => {
      const input = document.getElementById("auth-password");
      input.type  = input.type === "password" ? "text" : "password";
    });
  </script>
</body>
</html>
